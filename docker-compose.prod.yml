# Production stack. Same images as development, but the API runs the
# bootstrap and gunicorn instead of a reloading uvicorn, and nothing is
# mounted from the host.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#
# ENVIRONMENT=production in .env makes the app refuse to start on a
# placeholder JWT secret, a "*" CORS origin, or a plain http:// origin.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port. Only the API talks to it, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # The image's own CMD is ./bootstrap.sh; nothing to override here.
    env_file:
      - .env
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    ports:
      - "${API_PORT:-8000}:8000"
    # No volumes: the image is the deliverable, and a bind mount would let
    # whatever is on the host silently replace what was tested.
    volumes:
      - model_artifacts:/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  db_data:
  # Kept out of the image so a retrain survives a rebuild.
  model_artifacts:
