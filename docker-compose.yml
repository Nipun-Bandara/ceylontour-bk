services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceylontour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceylontour}
      POSTGRES_DB: ${POSTGRES_DB:-ceylontour}
    ports:
      # Host port only, for psql and GUI clients. Override in .env if another
      # project already holds 5432 on your machine.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The api service waits on this, so it must not start before the
      # database can actually answer a query.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceylontour} -d ${POSTGRES_DB:-ceylontour}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cache:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Source is mounted, not copied, so --reload picks up edits without a
      # rebuild.
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  db_data:
